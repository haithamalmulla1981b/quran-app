name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Generate Android project (first build only)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.hmalmulla --project-name quran_app .
            rm -rf test
            M=android/app/src/main/AndroidManifest.xml
            # Internet for streaming audio and fonts; local cleartext for the audio cache proxy
            sed -i '0,/<application/s|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$M"
            sed -i 's|android:label="quran_app"|android:label="القرآن الكريم" android:usesCleartextTraffic="true"|' "$M"
            grep -q 'permission.INTERNET' "$M"
            grep -q 'usesCleartextTraffic' "$M"
          fi

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as a release (easy download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
